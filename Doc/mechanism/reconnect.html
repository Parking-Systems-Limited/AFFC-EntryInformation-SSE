<header>
  <h1>SSE 重連 / Ping / Watchdog</h1>

  <nav style="margin-top:10px">

<div class="wrap"><div class="frame">
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 980" width="1280" height="980" role="img" aria-label="SSE reconnect ping watchdog visibility">
  <defs>
    <style>
      .title { font: 700 24px "Segoe UI", "Noto Sans TC", "Microsoft JhengHei", sans-serif; fill: #0f172a; }
      .sub { font: 500 13px "Segoe UI", "Noto Sans TC", "Microsoft JhengHei", sans-serif; fill: #475569; }
      .h { font: 700 14px "Segoe UI", "Noto Sans TC", "Microsoft JhengHei", sans-serif; fill: #0f172a; }
      .t { font: 500 12px "Segoe UI", "Noto Sans TC", "Microsoft JhengHei", sans-serif; fill: #1e293b; }
      .mono { font: 600 11px ui-monospace, Consolas, monospace; fill: #0f172a; }
      .sm { font: 500 11px "Segoe UI", "Noto Sans TC", sans-serif; fill: #475569; }
    </style>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#0f172a"/>
    </marker>
    <marker id="aGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#059669"/>
    </marker>
    <marker id="aRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#dc2626"/>
    </marker>
    <marker id="aAmber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#d97706"/>
    </marker>
  </defs>

  <rect width="1280" height="980" fill="#f8fafc"/>
  <rect x="20" y="20" width="1240" height="940" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>

  <text x="44" y="56" class="title">SSE 穩定性 — Ping / Watchdog / Reconnect / Visibility</text>
  <text x="44" y="78" class="sub">根因：長閒置被中間層切斷，或 EventSource CLOSED 後瀏覽器未自動重連；前端僅改狀態未強制 new EventSource</text>

  <!-- ========== LEFT: Problem vs Target ========== -->
  <g transform="translate(44, 100)">
    <rect width="380" height="200" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
    <text x="16" y="28" class="h" fill="#991b1b">舊問題（Before）</text>
    <text x="16" y="56" class="t">1. Backend ping 過長（曾 60s）</text>
    <text x="16" y="78" class="t">2. 閒置連線被 proxy／中間層殺掉</text>
    <text x="16" y="100" class="t">3. EventSource → CLOSED</text>
    <text x="16" y="122" class="t">4. 前端只改 UI 狀態，未 close+new</text>
    <text x="16" y="144" class="t">5. 結果：長閒置後「不會回來」</text>
    <text x="16" y="178" class="mono" fill="#991b1b">症狀：離線後永久卡住</text>
  </g>

  <g transform="translate(448, 100)">
    <rect width="380" height="200" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
    <text x="16" y="28" class="h" fill="#065f46">目標設計（After · 已落地）</text>
    <text x="16" y="56" class="t">1. Backend ping ≈ 20s（設定值）</text>
    <text x="16" y="78" class="t">2. onerror：自行排程重連（接管瀏覽器）</text>
    <text x="16" y="100" class="t">3. 指數退避 1→2→5→10→30s</text>
    <text x="16" y="122" class="t">4. Watchdog：90s 無任何事件 → 強制重連</text>
    <text x="16" y="144" class="t">5. visibility=visible 且非 OPEN → reconnect</text>
    <text x="16" y="178" class="mono" fill="#065f46">UI：connecting / open / reconnecting / offline</text>
  </g>

  <g transform="translate(852, 100)">
    <rect width="384" height="200" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
    <text x="16" y="28" class="h" fill="#1e40af">常數（Frontend App.tsx）</text>
    <text x="16" y="56" class="mono">SSE_BACKOFF_MS = [1,2,5,10,30]s</text>
    <text x="16" y="78" class="mono">SSE_WATCHDOG_MS = 90_000</text>
    <text x="16" y="100" class="mono">SSE_WATCHDOG_TICK_MS = 5_000</text>
    <text x="16" y="130" class="h" fill="#1e40af">Backend appsettings</text>
    <text x="16" y="154" class="mono">Sse:PingIntervalSeconds = 20</text>
    <text x="16" y="178" class="mono">ListenUrl = http://localhost:5100</text>
  </g>

  <!-- ========== CENTER FLOW: Backend ping ========== -->
  <g transform="translate(44, 330)">
    <rect width="590" height="280" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
    <text x="16" y="28" class="h">Backend：Ping Keep-Alive</text>

    <!-- flow boxes -->
    <rect x="24" y="50" width="160" height="50" rx="8" fill="#ffffff" stroke="#d97706"/>
    <text x="104" y="72" text-anchor="middle" class="t">SSE Subscribe</text>
    <text x="104" y="88" text-anchor="middle" class="sm">channel + ping task</text>

    <line x1="184" y1="75" x2="220" y2="75" stroke="#0f172a" stroke-width="2" marker-end="url(#a)"/>

    <rect x="220" y="50" width="160" height="50" rx="8" fill="#ffffff" stroke="#d97706"/>
    <text x="300" y="72" text-anchor="middle" class="t">Delay 20s</text>
    <text x="300" y="88" text-anchor="middle" class="sm">PingIntervalMs</text>

    <line x1="380" y1="75" x2="416" y2="75" stroke="#0f172a" stroke-width="2" marker-end="url(#a)"/>

    <rect x="416" y="50" width="150" height="50" rx="8" fill="#ecfdf5" stroke="#059669"/>
    <text x="491" y="72" text-anchor="middle" class="t">event: ping</text>
    <text x="491" y="88" text-anchor="middle" class="sm">ts / clientKey / ip</text>

    <text x="16" y="140" class="t">循環直到連線取消（RequestAborted / client close）</text>
    <text x="16" y="168" class="t">前端收到 ping → noteEvent() 刷新 lastEventAt + resetBackoff()</text>
    <text x="16" y="196" class="t">目的：讓中間層與瀏覽器認定連線「仍活躍」</text>

    <rect x="16" y="220" width="558" height="40" rx="6" fill="#fef3c7"/>
    <text x="28" y="245" class="t">Ping 是 keepalive 事件，不是業務資料；不更新車牌面板</text>
  </g>

  <!-- ========== RIGHT FLOW: Frontend reconnect state machine ========== -->
  <g transform="translate(654, 330)">
    <rect width="582" height="280" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
    <text x="16" y="28" class="h">Frontend：重連狀態機</text>

    <!-- states -->
    <rect x="30" y="55" width="110" height="40" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="85" y="80" text-anchor="middle" class="t">connecting</text>

    <rect x="200" y="55" width="110" height="40" rx="8" fill="#bbf7d0" stroke="#059669" stroke-width="2"/>
    <text x="255" y="80" text-anchor="middle" class="t">open</text>

    <rect x="370" y="55" width="130" height="40" rx="8" fill="#fde68a" stroke="#d97706" stroke-width="2"/>
    <text x="435" y="80" text-anchor="middle" class="t">reconnecting</text>

    <rect x="200" y="140" width="110" height="40" rx="8" fill="#fecaca" stroke="#dc2626" stroke-width="2"/>
    <text x="255" y="165" text-anchor="middle" class="t">offline</text>

    <!-- arrows between states -->
    <line x1="140" y1="75" x2="198" y2="75" stroke="#059669" stroke-width="2" marker-end="url(#aGreen)"/>
    <text x="169" y="68" text-anchor="middle" class="sm" fill="#047857">onopen</text>

    <line x1="310" y1="75" x2="368" y2="75" stroke="#dc2626" stroke-width="2" marker-end="url(#aRed)"/>
    <text x="339" y="68" text-anchor="middle" class="sm" fill="#b91c1c">error</text>

    <path d="M435 95 V125 H255 V140" fill="none" stroke="#d97706" stroke-width="2" marker-end="url(#aAmber)"/>
    <text x="360" y="120" class="sm" fill="#b45309">backoff 後 connect()</text>

    <text x="30" y="210" class="t">關鍵步驟 forceReconnect / scheduleReconnect：</text>
    <text x="30" y="232" class="mono">closeEs() → new EventSource(url)</text>
    <text x="30" y="254" class="t">成功 onopen → resetBackoff()；dispose 時 → offline</text>
  </g>

  <!-- ========== BOTTOM: Three trigger paths ========== -->
  <g transform="translate(44, 640)">
    <text x="0" y="0" class="h">三種強制重連觸發</text>

    <!-- Trigger 1 -->
    <g transform="translate(0, 20)">
      <rect width="380" height="200" rx="10" fill="#ffffff" stroke="#dc2626" stroke-width="2"/>
      <rect width="380" height="36" rx="10" fill="#dc2626"/>
      <rect y="24" width="380" height="12" fill="#dc2626"/>
      <text x="190" y="24" text-anchor="middle" fill="#fff" font-size="13" font-weight="700" font-family="Segoe UI, Noto Sans TC, sans-serif">① EventSource onerror / CLOSED</text>
      <text x="16" y="60" class="t">source.onerror 觸發</text>
      <text x="16" y="84" class="t">→ closeEs()（關閉舊連線）</text>
      <text x="16" y="108" class="t">→ scheduleReconnect()</text>
      <text x="16" y="132" class="t">→ 延遲 SSE_BACKOFF_MS[idx]</text>
      <text x="16" y="156" class="t">→ connect() 建立新 EventSource</text>
      <text x="16" y="184" class="sm">刻意接管瀏覽器自動重試，避免雙連線</text>
    </g>

    <!-- Trigger 2 -->
    <g transform="translate(400, 20)">
      <rect width="380" height="200" rx="10" fill="#ffffff" stroke="#d97706" stroke-width="2"/>
      <rect width="380" height="36" rx="10" fill="#d97706"/>
      <rect y="24" width="380" height="12" fill="#d97706"/>
      <text x="190" y="24" text-anchor="middle" fill="#fff" font-size="13" font-weight="700" font-family="Segoe UI, Noto Sans TC, sans-serif">② Ping Watchdog（90s）</text>
      <text x="16" y="60" class="t">每 5s 檢查 lastEventAt</text>
      <text x="16" y="84" class="t">（vehicle / info / clear / error / ping）</text>
      <text x="16" y="108" class="t">若 now - lastEventAt ≥ 90s</text>
      <text x="16" y="132" class="t">且頁面 visible → forceReconnect()</text>
      <text x="16" y="156" class="t">（立即重連，不走退避佇列）</text>
      <text x="16" y="184" class="sm">偵測「僵屍連線」：看似開著但無流量</text>
    </g>

    <!-- Trigger 3 -->
    <g transform="translate(800, 20)">
      <rect width="396" height="200" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
      <rect width="396" height="36" rx="10" fill="#2563eb"/>
      <rect y="24" width="396" height="12" fill="#2563eb"/>
      <text x="198" y="24" text-anchor="middle" fill="#fff" font-size="13" font-weight="700" font-family="Segoe UI, Noto Sans TC, sans-serif">③ Visibility 回前景</text>
      <text x="16" y="60" class="t">document.visibilitychange</text>
      <text x="16" y="84" class="t">visibilityState === 'visible'</text>
      <text x="16" y="108" class="t">且 (!es || readyState !== OPEN)</text>
      <text x="16" y="132" class="t">→ forceReconnect()</text>
      <text x="16" y="156" class="t">隱藏分頁時 watchdog 不強制重連</text>
      <text x="16" y="184" class="sm">避免背景節流造成誤判；回前景立即修復</text>
    </g>
  </g>

  <text x="44" y="920" class="sub">成功準則：長閒置後 ping 持續 → 連線存活；若被殺 → 前端自動 close+new 回到 open，無需人工重新整理。</text>
</svg>

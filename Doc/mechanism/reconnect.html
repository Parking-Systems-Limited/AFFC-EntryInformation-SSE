  <text x="40" y="56" class="title">SSE 穩定性 — Ping / Watchdog / Reconnect / Visibility</text>
  <text x="40" y="78" class="sub">根因：長閒置被中間層切斷，或 EventSource CLOSED 後瀏覽器未自動重連；前端僅改狀態未強制 new EventSource</text>

  <!-- Row 1: 3 equal cards -->
  <g transform="translate(40, 100)">
    <rect width="384" height="200" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
    <text x="16" y="28" class="h" fill="#991b1b">舊問題（Before）</text>
    <text x="16" y="56" class="t">1. Backend ping 過長（曾 60s）</text>
    <text x="16" y="78" class="t">2. 閒置連線被 proxy／中間層殺掉</text>
    <text x="16" y="100" class="t">3. EventSource → CLOSED</text>
    <text x="16" y="122" class="t">4. 前端只改 UI 狀態，未 close+new</text>
    <text x="16" y="144" class="t">5. 結果：長閒置後「不會回來」</text>
    <text x="16" y="178" class="t" fill="#991b1b" font-weight="700">症狀：離線後永久卡住</text>
  </g>

  <g transform="translate(448, 100)">
    <rect width="384" height="200" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
    <text x="16" y="28" class="h" fill="#065f46">目標設計（After · 已落地）</text>
    <text x="16" y="56" class="t">1. Backend ping ≈ 20s（設定值）</text>
    <text x="16" y="78" class="t">2. onerror：自行排程重連（接管瀏覽器）</text>
    <text x="16" y="100" class="t">3. 指數退避 1→2→5→10→30s</text>
    <text x="16" y="122" class="t">4. Watchdog：90s 無任何事件 → 強制重連</text>
    <text x="16" y="144" class="t">5. visibility=visible 且非 OPEN → reconnect</text>
    <text x="16" y="178" class="t" fill="#065f46" font-weight="700">UI：connecting / open / reconnecting / offline</text>
  </g>

  <g transform="translate(856, 100)">
    <rect width="384" height="200" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
    <text x="16" y="28" class="h" fill="#1e40af">常數（Frontend App.tsx）</text>
    <text x="16" y="56" class="mono">SSE_BACKOFF_MS = [1,2,5,10,30]s</text>
    <text x="16" y="78" class="mono">SSE_WATCHDOG_MS = 90_000</text>
    <text x="16" y="100" class="mono">SSE_WATCHDOG_TICK_MS = 5_000</text>
    <text x="16" y="130" class="h" fill="#1e40af">Backend appsettings</text>
    <text x="16" y="154" class="mono">Sse:PingIntervalSeconds = 20</text>
    <text x="16" y="178" class="mono">ListenUrl = http://localhost:5100</text>
  </g>

  <!-- Row 2 left: Backend ping -->
  <g transform="translate(40, 324)">
    <rect width="588" height="300" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
    <text x="16" y="28" class="h">Backend：Ping Keep-Alive</text>

    <!-- 3 equal flow boxes -->
    <g transform="translate(24, 52)">
      <rect width="160" height="52" rx="8" fill="#ffffff" stroke="#d97706" stroke-width="1.5"/>
      <text x="80" y="22" text-anchor="middle" class="t">SSE Subscribe</text>
      <text x="80" y="40" text-anchor="middle" class="sm">channel + ping task</text>

      <line x1="160" y1="26" x2="188" y2="26" stroke="#0f172a" stroke-width="2" marker-end="url(#arrDark)"/>

      <rect x="188" y="0" width="160" height="52" rx="8" fill="#ffffff" stroke="#d97706" stroke-width="1.5"/>
      <text x="268" y="22" text-anchor="middle" class="t">Delay 20s</text>
      <text x="268" y="40" text-anchor="middle" class="sm">PingIntervalMs</text>

      <line x1="348" y1="26" x2="376" y2="26" stroke="#0f172a" stroke-width="2" marker-end="url(#arrDark)"/>

      <rect x="376" y="0" width="160" height="52" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
      <text x="456" y="22" text-anchor="middle" class="t">event: ping</text>
      <text x="456" y="40" text-anchor="middle" class="sm">ts / clientKey / ip</text>
    </g>

    <text x="16" y="140" class="t">循環直到連線取消（RequestAborted / client close）</text>
    <text x="16" y="168" class="t">前端收到 ping → noteEvent() 刷新 lastEventAt + resetBackoff()</text>
    <text x="16" y="196" class="t">目的：讓中間層與瀏覽器認定連線「仍活躍」</text>

    <rect x="16" y="230" width="556" height="44" rx="6" fill="#fef3c7"/>
    <text x="28" y="258" class="t">Ping 是 keepalive 事件，不是業務資料；不更新車牌面板</text>
  </g>

  <!-- Row 2 right: state machine -->
  <g transform="translate(652, 324)">
    <rect width="588" height="300" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
    <text x="16" y="28" class="h">Frontend：重連狀態機</text>

    <!-- states on clean grid: row of 3, offline below open -->
    <rect x="28" y="56" width="120" height="40" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="88" y="81" text-anchor="middle" class="t">connecting</text>

    <rect x="200" y="56" width="120" height="40" rx="8" fill="#bbf7d0" stroke="#059669" stroke-width="2"/>
    <text x="260" y="81" text-anchor="middle" class="t">open</text>

    <rect x="372" y="56" width="140" height="40" rx="8" fill="#fde68a" stroke="#d97706" stroke-width="2"/>
    <text x="442" y="81" text-anchor="middle" class="t">reconnecting</text>

    <rect x="200" y="150" width="120" height="40" rx="8" fill="#fecaca" stroke="#dc2626" stroke-width="2"/>
    <text x="260" y="175" text-anchor="middle" class="t">offline</text>

    <!-- arrows -->
    <line x1="148" y1="76" x2="198" y2="76" stroke="#059669" stroke-width="2" marker-end="url(#arrGreen)"/>
    <text x="173" y="68" text-anchor="middle" class="sm" fill="#047857">onopen</text>

    <line x1="320" y1="76" x2="370" y2="76" stroke="#dc2626" stroke-width="2" marker-end="url(#arrRed)"/>
    <text x="345" y="68" text-anchor="middle" class="sm" fill="#b91c1c">error</text>

    <path d="M442 96 V130 H260 V150" fill="none" stroke="#d97706" stroke-width="2" marker-end="url(#arrAmber)"/>
    <text x="360" y="124" class="sm" fill="#b45309">backoff 後 connect()</text>

    <!-- from offline back hint -->
    <path d="M200 170 H120 V76" fill="none" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrDark)"/>
    <text x="110" y="130" text-anchor="end" class="sm" fill="#1e40af">dispose→</text>

    <text x="28" y="230" class="t">關鍵步驟 forceReconnect / scheduleReconnect：</text>
    <text x="28" y="254" class="mono">closeEs() → new EventSource(url)</text>
    <text x="28" y="278" class="t">成功 onopen → resetBackoff()；dispose 時 → offline</text>
  </g>

  <!-- Row 3 title -->
  <text x="40" y="660" class="h">三種強制重連觸發</text>

  <!-- 3 equal trigger cards -->
  <g transform="translate(40, 668)">
    <rect width="384" height="210" rx="10" fill="#ffffff" stroke="#dc2626" stroke-width="2"/>
    <rect width="384" height="36" rx="10" fill="#dc2626"/>
    <rect y="24" width="384" height="12" fill="#dc2626"/>
    <text x="192.0" y="24" text-anchor="middle" fill="#fff" font-size="13" font-weight="700"
          font-family='Noto Sans CJK TC, Noto Sans CJK, Noto Sans, sans-serif'>① EventSource onerror / CLOSED</text>
    <text x="16" y="60" class="t">source.onerror 觸發</text>
    <text x="16" y="84" class="t">→ closeEs()（關閉舊連線）</text>
    <text x="16" y="108" class="t">→ scheduleReconnect()</text>
    <text x="16" y="132" class="t">→ 延遲 SSE_BACKOFF_MS[idx]</text>
    <text x="16" y="156" class="t">→ connect() 建立新 EventSource</text>
    <text x="16" y="188" class="sm">刻意接管瀏覽器自動重試，避免雙連線</text>
  </g>

  <g transform="translate(448, 668)">
    <rect width="384" height="210" rx="10" fill="#ffffff" stroke="#d97706" stroke-width="2"/>
    <rect width="384" height="36" rx="10" fill="#d97706"/>
    <rect y="24" width="384" height="12" fill="#d97706"/>
    <text x="192.0" y="24" text-anchor="middle" fill="#fff" font-size="13" font-weight="700"
          font-family='Noto Sans CJK TC, Noto Sans CJK, Noto Sans, sans-serif'>② Ping Watchdog（90s）</text>
    <text x="16" y="60" class="t">每 5s 檢查 lastEventAt</text>
    <text x="16" y="84" class="t">（vehicle / info / clear / error / ping）</text>
    <text x="16" y="108" class="t">若 now - lastEventAt ≥ 90s</text>
    <text x="16" y="132" class="t">且頁面 visible → forceReconnect()</text>
    <text x="16" y="156" class="t">（立即重連，不走退避佇列）</text>
    <text x="16" y="188" class="sm">偵測「僵屍連線」：看似開著但無流量</text>
  </g>

  <g transform="translate(856, 668)">
    <rect width="384" height="210" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
    <rect width="384" height="36" rx="10" fill="#2563eb"/>
    <rect y="24" width="384" height="12" fill="#2563eb"/>
    <text x="192.0" y="24" text-anchor="middle" fill="#fff" font-size="13" font-weight="700"
          font-family='Noto Sans CJK TC, Noto Sans CJK, Noto Sans, sans-serif'>③ Visibility 回前景</text>
    <text x="16" y="60" class="t">document.visibilitychange</text>
    <text x="16" y="84" class="t">visibilityState === 'visible'</text>
    <text x="16" y="108" class="t">且 (!es || readyState !== OPEN)</text>
    <text x="16" y="132" class="t">→ forceReconnect()</text>
    <text x="16" y="156" class="t">隱藏分頁時 watchdog 不強制重連</text>
    <text x="16" y="188" class="sm">避免背景節流造成誤判；回前景立即修復</text>
  </g>

  <text x="40" y="964" class="sub">成功準則：長閒置後 ping 持續 → 連線存活；若被殺 → 前端自動 close+new 回到 open，無需人工重新整理。</text>

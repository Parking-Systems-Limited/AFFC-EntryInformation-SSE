<html lang="zh-Hant">

<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>失敗路徑</title>
<style>
  :root { color-scheme: light dark; }
  body { margin: 0; background: #0f172a; color: #e2e8f0; font-family: "Segoe UI", "Noto Sans TC", "Microsoft JhengHei", sans-serif; }
  header { padding: 16px 24px; border-bottom: 1px solid #334155; background: #1e293b; }
  h1 { margin: 0; font-size: 18px; font-weight: 700; }
  p { margin: 6px 0 0; font-size: 13px; color: #94a3b8; }
  nav a { color: #93c5fd; margin-right: 14px; font-size: 13px; }
  .wrap { padding: 16px; overflow: auto; }
  .frame { background: #fff; border-radius: 12px; padding: 8px; box-shadow: 0 8px 24px rgba(0,0,0,.35); }
  img, object { width: 100%; height: auto; display: block; }
</style>
</head>
<body>
<header>
  <h1>失敗路徑</h1>
  <p>LPRS timeout / 業務錯誤 / SSE closed · 無假資料</p>
  <nav style="margin-top:10px">
    <a href="architecture.html">架構</a>
    <a href="sequence-happy.html">Happy Path</a>
    <a href="reconnect.html">重連</a>
    <a href="failure-paths.html">失敗路徑</a>
    <a href="README.md">README</a>
  </nav>
</header>
<div class="wrap"><div class="frame">
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 780" width="1280" height="780" role="img" aria-label="Failure paths LPRS SSE">
  <defs>
    <style>
      .title { font: 700 24px "Segoe UI", "Noto Sans TC", "Microsoft JhengHei", sans-serif; fill: #0f172a; }
      .sub { font: 500 13px "Segoe UI", "Noto Sans TC", "Microsoft JhengHei", sans-serif; fill: #475569; }
      .h { font: 700 14px "Segoe UI", "Noto Sans TC", "Microsoft JhengHei", sans-serif; fill: #0f172a; }
      .t { font: 500 12px "Segoe UI", "Noto Sans TC", "Microsoft JhengHei", sans-serif; fill: #1e293b; }
      .mono { font: 600 11px ui-monospace, Consolas, monospace; fill: #0f172a; }
      .sm { font: 500 11px "Segoe UI", "Noto Sans TC", sans-serif; fill: #475569; }
    </style>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#0f172a"/>
    </marker>
  </defs>

  <rect width="1280" height="780" fill="#f8fafc"/>
  <rect x="20" y="20" width="1240" height="740" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>

  <text x="44" y="56" class="title">Failure Paths — LPRS 錯誤 / Timeout / SSE 斷線</text>
  <text x="44" y="78" class="sub">原則：失敗時 Publish event: error，不推假資料（no fake data）</text>

  <!-- Decision tree start -->
  <rect x="480" y="100" width="280" height="48" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="620" y="130" text-anchor="middle" class="t">POST /api/vehicle {clientKey, lpn}</text>

  <line x1="620" y1="148" x2="620" y2="180" stroke="#0f172a" stroke-width="2" marker-end="url(#arr)"/>

  <rect x="480" y="180" width="280" height="48" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
  <text x="620" y="210" text-anchor="middle" class="t">Backend → LPRS GET Vehicle/{lpn}</text>

  <!-- Branch lines -->
  <line x1="620" y1="228" x2="620" y2="260" stroke="#0f172a" stroke-width="2"/>
  <line x1="160" y1="260" x2="1120" y2="260" stroke="#0f172a" stroke-width="2"/>
  <line x1="160" y1="260" x2="160" y2="290" stroke="#0f172a" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="400" y1="260" x2="400" y2="290" stroke="#0f172a" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="640" y1="260" x2="640" y2="290" stroke="#0f172a" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="880" y1="260" x2="880" y2="290" stroke="#0f172a" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="1120" y1="260" x2="1120" y2="290" stroke="#0f172a" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Branch 1: Timeout -->
  <g transform="translate(40, 290)">
    <rect width="240" height="220" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
    <text x="120" y="28" text-anchor="middle" class="h" fill="#991b1b">Timeout</text>
    <text x="16" y="56" class="t">LPRS &gt; TimeoutSeconds</text>
    <text x="16" y="76" class="mono">(預設 15s)</text>
    <text x="16" y="104" class="t">HTTP 對呼叫端：504</text>
    <text x="16" y="128" class="t">SSE：Publish error</text>
    <text x="16" y="152" class="mono">"LPRS API timeout"</text>
    <text x="16" y="184" class="sm">面板顯示錯誤橫幅</text>
    <text x="16" y="204" class="sm">不更新車牌假資料</text>
  </g>

  <!-- Branch 2: Unreachable / HTTP -->
  <g transform="translate(280, 290)">
    <rect width="240" height="220" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
    <text x="120" y="28" text-anchor="middle" class="h" fill="#991b1b">Unreachable / HTTP</text>
    <text x="16" y="56" class="t">網路例外或非 2xx</text>
    <text x="16" y="80" class="t">HTTP 對呼叫端：502</text>
    <text x="16" y="104" class="t">SSE：Publish error</text>
    <text x="16" y="128" class="mono">unreachable / HTTP error</text>
    <text x="16" y="160" class="sm">含 statusCode / body 截斷</text>
    <text x="16" y="184" class="sm">JSON parse 失敗同屬 502</text>
  </g>

  <!-- Branch 3: Business 997 -->
  <g transform="translate(520, 290)">
    <rect width="240" height="220" rx="10" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
    <text x="120" y="28" text-anchor="middle" class="h" fill="#9a3412">LPRS 業務錯誤</text>
    <text x="16" y="56" class="t">resCode ≠ 成功</text>
    <text x="16" y="76" class="mono">例：997 等業務碼</text>
    <text x="16" y="104" class="t">HTTP：依實作回傳錯誤</text>
    <text x="16" y="128" class="t">SSE：Publish error</text>
    <text x="16" y="152" class="mono">resCode + resMsg</text>
    <text x="16" y="184" class="sm">前端 lastError 顯示訊息</text>
    <text x="16" y="204" class="sm">不偽造車輛欄位</text>
  </g>

  <!-- Branch 4: Success contrast -->
  <g transform="translate(760, 290)">
    <rect width="240" height="220" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
    <text x="120" y="28" text-anchor="middle" class="h" fill="#065f46">成功對照</text>
    <text x="16" y="56" class="t">resCode 成功 + data</text>
    <text x="16" y="80" class="t">VehiclePanelMapper.Map</text>
    <text x="16" y="104" class="t">Publish vehicle + info</text>
    <text x="16" y="128" class="mono">event: vehicle</text>
    <text x="16" y="152" class="t">HTTP 200 {status:sent}</text>
    <text x="16" y="184" class="sm">面板更新真實欄位</text>
  </g>

  <!-- Branch 5: SSE closed -->
  <g transform="translate(1000, 290)">
    <rect width="220" height="220" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
    <text x="110" y="28" text-anchor="middle" class="h" fill="#5b21b6">SSE Closed</text>
    <text x="16" y="56" class="t">中間層／閒置切斷</text>
    <text x="16" y="80" class="t">或後端重啟</text>
    <text x="16" y="104" class="t">前端 onerror</text>
    <text x="16" y="128" class="t">→ scheduleReconnect</text>
    <text x="16" y="152" class="mono">backoff 1→30s</text>
    <text x="16" y="176" class="t">或 watchdog 90s</text>
    <text x="16" y="200" class="sm">UI → reconnecting</text>
  </g>

  <!-- Bottom note strip -->
  <rect x="40" y="540" width="1200" height="180" rx="10" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="60" y="575" class="h">前端對 error 事件的處理</text>
  <text x="60" y="605" class="t">• 具名 SSE 事件 event: error（伺服器業務／LPRS 失敗）→ setLastError(msg)，連線維持 open</text>
  <text x="60" y="630" class="t">• 連線層 source.onerror（傳輸中斷）→ close + 退避重連，狀態 reconnecting</text>
  <text x="60" y="655" class="t">• 兩者勿混淆：前者是「有資料的錯誤推播」；後者是「通道死了要重建」</text>
  <text x="60" y="690" class="t">• 驗證建議：Postman 打不存在車牌／斷開 LPRS → 面板應見錯誤字串且無假車牌；殺後端進程 → 應自動回到 open</text>
</svg>

</div></div>
</body>
</html>

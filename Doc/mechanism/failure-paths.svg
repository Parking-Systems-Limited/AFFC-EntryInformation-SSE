<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 820" width="1280" height="820"
     role="img" aria-label="Failure paths LPRS SSE">
  <defs>
    <style>
      
      .title { font: 700 24px "Noto Sans CJK TC", "Noto Sans CJK", "Noto Sans", sans-serif; fill: #0f172a; }
      .sub { font: 500 13px "Noto Sans CJK TC", "Noto Sans CJK", "Noto Sans", sans-serif; fill: #475569; }
      .h { font: 700 14px "Noto Sans CJK TC", "Noto Sans CJK", "Noto Sans", sans-serif; fill: #0f172a; }
      .t { font: 500 12px "Noto Sans CJK TC", "Noto Sans CJK", "Noto Sans", sans-serif; fill: #1e293b; }
      .sm { font: 500 11px "Noto Sans CJK TC", "Noto Sans CJK", "Noto Sans", sans-serif; fill: #475569; }
      .mono { font: 600 11px "Noto Sans CJK TC", ui-monospace, "Cascadia Code", Consolas, monospace; fill: #0f172a; }
      .mono-sm { font: 500 10px "Noto Sans CJK TC", ui-monospace, "Cascadia Code", Consolas, monospace; fill: #334155; }
      .box-title { font: 700 14px "Noto Sans CJK TC", "Noto Sans CJK", "Noto Sans", sans-serif; fill: #0f172a; }
      .label { font: 500 12px "Noto Sans CJK TC", "Noto Sans CJK", "Noto Sans", sans-serif; fill: #1e293b; }
      .legend { font: 500 11px "Noto Sans CJK TC", "Noto Sans CJK", "Noto Sans", sans-serif; fill: #1e293b; }
      .actor { font: 700 13px "Noto Sans CJK TC", "Noto Sans CJK", "Noto Sans", sans-serif; fill: #0f172a; }
      .msg { font: 500 12px "Noto Sans CJK TC", "Noto Sans CJK", "Noto Sans", sans-serif; fill: #1e293b; }
      .note { font: 500 11px "Noto Sans CJK TC", "Noto Sans CJK", "Noto Sans", sans-serif; fill: #475569; }
    
    </style>
    <marker id="arrDark" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#0f172a"/></marker>
  </defs>

  <rect width="1280" height="820" fill="#f8fafc"/>
  <rect x="24" y="24" width="1232" height="772" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>

  <text x="40" y="56" class="title">Failure Paths — LPRS 錯誤 / Timeout / SSE 斷線</text>
  <text x="40" y="78" class="sub">原則：失敗時 Publish event: error，不推假資料（no fake data）</text>

  <!-- Decision start -->
  <rect x="490" y="100" width="300" height="48" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="640.0" y="130" text-anchor="middle" class="t">POST /api/vehicle {clientKey, lpn}</text>

  <line x1="640.0" y1="148" x2="640.0" y2="172" stroke="#0f172a" stroke-width="2" marker-end="url(#arrDark)"/>

  <rect x="490" y="172" width="300" height="48" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
  <text x="640.0" y="202" text-anchor="middle" class="t">Backend → LPRS GET Vehicle/{lpn}</text>

  <!-- Branch spine -->
  <line x1="640.0" y1="220" x2="640.0" y2="248" stroke="#0f172a" stroke-width="2"/>
  <line x1="152.0" y1="248" x2="1128.0" y2="248" stroke="#0f172a" stroke-width="2"/>
  <line x1="152.0" y1="248" x2="152.0" y2="290" stroke="#0f172a" stroke-width="2" marker-end="url(#arrDark)"/>
  <line x1="396.0" y1="248" x2="396.0" y2="290" stroke="#0f172a" stroke-width="2" marker-end="url(#arrDark)"/>
  <line x1="640.0" y1="248" x2="640.0" y2="290" stroke="#0f172a" stroke-width="2" marker-end="url(#arrDark)"/>
  <line x1="884.0" y1="248" x2="884.0" y2="290" stroke="#0f172a" stroke-width="2" marker-end="url(#arrDark)"/>
  <line x1="1128.0" y1="248" x2="1128.0" y2="290" stroke="#0f172a" stroke-width="2" marker-end="url(#arrDark)"/>
  <g transform="translate(42, 290)">
    <rect width="220" height="230" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
    <text x="110.0" y="28" text-anchor="middle" class="h" fill="#991b1b">Timeout</text>
    <text x="14" y="56" class="t">LPRS > TimeoutSeconds</text>
    <text x="14" y="78" class="mono">(預設 15s)</text>
    <text x="14" y="100" class="t">HTTP 對呼叫端：504</text>
    <text x="14" y="122" class="t">SSE：Publish error</text>
    <text x="14" y="144" class="mono">"LPRS API timeout"</text>
    <text x="14" y="166" class="sm">面板顯示錯誤橫幅</text>
    <text x="14" y="186" class="sm">不更新車牌假資料</text>
  </g>
  <g transform="translate(286, 290)">
    <rect width="220" height="230" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
    <text x="110.0" y="28" text-anchor="middle" class="h" fill="#991b1b">Unreachable / HTTP</text>
    <text x="14" y="56" class="t">網路例外或非 2xx</text>
    <text x="14" y="78" class="t">HTTP 對呼叫端：502</text>
    <text x="14" y="100" class="t">SSE：Publish error</text>
    <text x="14" y="122" class="mono">unreachable / HTTP error</text>
    <text x="14" y="144" class="sm">含 statusCode / body 截斷</text>
    <text x="14" y="164" class="sm">JSON parse 失敗同屬 502</text>
  </g>
  <g transform="translate(530, 290)">
    <rect width="220" height="230" rx="10" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
    <text x="110.0" y="28" text-anchor="middle" class="h" fill="#9a3412">LPRS 業務錯誤</text>
    <text x="14" y="56" class="t">resCode ≠ 成功</text>
    <text x="14" y="78" class="mono">例：997 等業務碼</text>
    <text x="14" y="100" class="t">HTTP：依實作回傳錯誤</text>
    <text x="14" y="122" class="t">SSE：Publish error</text>
    <text x="14" y="144" class="mono">resCode + resMsg</text>
    <text x="14" y="166" class="sm">前端 lastError 顯示訊息</text>
    <text x="14" y="186" class="sm">不偽造車輛欄位</text>
  </g>
  <g transform="translate(774, 290)">
    <rect width="220" height="230" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
    <text x="110.0" y="28" text-anchor="middle" class="h" fill="#065f46">成功對照</text>
    <text x="14" y="56" class="t">resCode 成功 + data</text>
    <text x="14" y="78" class="t">VehiclePanelMapper.Map</text>
    <text x="14" y="100" class="t">Publish vehicle + info</text>
    <text x="14" y="122" class="mono">event: vehicle</text>
    <text x="14" y="144" class="t">HTTP 200 {status:sent}</text>
    <text x="14" y="166" class="sm">面板更新真實欄位</text>
  </g>
  <g transform="translate(1018, 290)">
    <rect width="220" height="230" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
    <text x="110.0" y="28" text-anchor="middle" class="h" fill="#5b21b6">SSE Closed</text>
    <text x="14" y="56" class="t">中間層／閒置切斷</text>
    <text x="14" y="78" class="t">或後端重啟</text>
    <text x="14" y="100" class="t">前端 onerror</text>
    <text x="14" y="122" class="t">→ scheduleReconnect</text>
    <text x="14" y="144" class="mono">backoff 1→30s</text>
    <text x="14" y="166" class="t">或 watchdog 90s</text>
    <text x="14" y="188" class="sm">UI → reconnecting</text>
  </g>

  <rect x="40" y="544" width="1200" height="228" rx="10" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="60" y="572" class="h">前端對 error 事件的處理</text>
  <text x="60" y="600" class="t">• 具名 SSE 事件 event: error（伺服器業務／LPRS 失敗）→ setLastError(msg)，連線維持 open</text>
  <text x="60" y="624" class="t">• 連線層 source.onerror（傳輸中斷）→ close + 退避重連，狀態 reconnecting</text>
  <text x="60" y="648" class="t">• 兩者勿混淆：前者是「有資料的錯誤推播」；後者是「通道死了要重建」</text>
  <text x="60" y="672" class="t">• 驗證建議：Postman 打不存在車牌／斷開 LPRS → 面板應見錯誤字串且無假車牌；殺後端進程 → 應自動回到 open</text>
</svg>